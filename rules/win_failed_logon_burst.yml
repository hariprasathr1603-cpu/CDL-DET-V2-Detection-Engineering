title: Multiple Failed Logon Attempts Burst
id: 3b7c8a10-4f21-4d9e-b812-1a2b3c4d5e14
status: experimental
description: Detects repeated failed Windows logon attempts within a short window.
author: Security Lab
date: 2026/11/20
tags:
    - attack.credential_access
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    timeframe: 5m
    condition: selection | count() > 10
falsepositives:
    - Mistyped passwords or expired service credentials
level: medium
