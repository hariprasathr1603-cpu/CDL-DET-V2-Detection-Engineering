title: Correlated Credential Tooling and Lateral Movement
id: 99c1d56f-6fa4-4928-9877-e4cc7f7a2aca
status: experimental
description: Credential access tooling correlated with remote/lateral activity
references:
  - https://attack.mitre.org/techniques/T1003
author: Detection Engineering Lab
date: 2026/11/20
tags:
  - attack.t1003
logsource:
  product: windows
detection:
  sel_cred:
    EventID: 10
    TargetImage|endswith: \lsass.exe
  sel_lat:
    EventID: 1
    Image|endswith:
      - \psexec.exe
      - \wmic.exe
  condition: sel_cred and sel_lat
falsepositives:
  - Security audit or remote admin
